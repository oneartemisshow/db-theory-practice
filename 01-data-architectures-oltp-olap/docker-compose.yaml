services:
  # Слой OLTP
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: marketplace_oltp
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql

  # Слой OLAP
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    ports:
      - "8123:8123" # HTTP
      - "9000:9000" # Native
    volumes:
      - ch_data:/var/lib/clickhouse

  # BI
  metabase:
    image: metabase/metabase:v0.65.x
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres
      - clickhouse

volumes:
  pg_data:
  ch_data:
  metabase_data: